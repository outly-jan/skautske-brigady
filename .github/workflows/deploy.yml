name: Deploy přes FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nahrát na server přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/wp-content/plugins/skautske-brigady/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**

      - name: Invalidovat PHP OPcache
        run: |
          curl -f "https://skautchlumec.cz/wp-content/plugins/skautske-brigady/deploy-webhook.php?token=${{ secrets.DEPLOY_SECRET }}" || true
